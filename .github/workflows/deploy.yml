name: Deploy Kyakhayen

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-kyakhayen
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    environment: KYAKHAYEN_DEPLOYMENT
    env:
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || vars.NEXT_PUBLIC_APP_URL || 'https://www.kyakhayen.com' }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL || 'https://www.kyakhayen.com' }}
      NEXT_PUBLIC_MEDIA_URL: ${{ secrets.NEXT_PUBLIC_MEDIA_URL || vars.NEXT_PUBLIC_MEDIA_URL || 'https://d2211nhxa294e1.cloudfront.net' }}
      NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID || vars.NEXT_PUBLIC_GTM_ID || 'GTM-N99FLD9B' }}
      NEXT_PUBLIC_DEFAULT_COUNTRY: ${{ secrets.NEXT_PUBLIC_DEFAULT_COUNTRY || vars.NEXT_PUBLIC_DEFAULT_COUNTRY || 'IN' }}
      NEXT_PUBLIC_DEFAULT_CURRENCY: ${{ secrets.NEXT_PUBLIC_DEFAULT_CURRENCY || vars.NEXT_PUBLIC_DEFAULT_CURRENCY || 'INR' }}
      NEXT_PUBLIC_EXCHANGE_API_URL: ${{ secrets.NEXT_PUBLIC_EXCHANGE_API_URL || vars.NEXT_PUBLIC_EXCHANGE_API_URL }}
      NEXT_PUBLIC_FREE_CURRENCY_API_KEY: ${{ secrets.NEXT_PUBLIC_FREE_CURRENCY_API_KEY || vars.NEXT_PUBLIC_FREE_CURRENCY_API_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST || '13.206.210.16' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER || 'ubuntu' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/kasa/kyakhayen' }}
      DB_TUNNEL_PORT: ${{ secrets.DB_TUNNEL_PORT || vars.DB_TUNNEL_PORT || '3307' }}
      DEPLOY_SSH_KEY_PRESENT: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint report
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate production build inputs
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is empty"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is empty"; exit 1; }
          test -n "$DEPLOY_PORT" || { echo "DEPLOY_PORT is empty"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is empty"; exit 1; }
          test "$DEPLOY_SSH_KEY_PRESENT" = "true" || { echo "DEPLOY_SSH_KEY secret is empty"; exit 1; }

      - name: Configure SSH for production build data
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/kyakhayen_deploy_key
          chmod 600 ~/.ssh/kyakhayen_deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare production build environment
        run: |
          ssh \
            -i ~/.ssh/kyakhayen_deploy_key \
            -p "$DEPLOY_PORT" \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" > .env.production <<'EOF'
          set -Eeuo pipefail
          test -f "$DEPLOY_PATH/.env" || { echo ".env file missing in $DEPLOY_PATH" >&2; exit 1; }
          cat "$DEPLOY_PATH/.env"
          EOF

          node <<'NODE'
          const fs = require("fs");

          const envPath = ".env.production";
          const tunnelPort = process.env.DB_TUNNEL_PORT || "3307";
          const lines = fs.readFileSync(envPath, "utf8").split(/\r?\n/);
          const databaseLineIndex = lines.findIndex((line) => line.startsWith("DATABASE_URL="));

          if (databaseLineIndex === -1) {
            throw new Error("DATABASE_URL is missing from the production .env file");
          }

          const line = lines[databaseLineIndex];
          const value = line.slice("DATABASE_URL=".length);
          const quote = value.startsWith("'") || value.startsWith('"') ? value[0] : "";
          const unquoted = quote ? value.slice(1, value.endsWith(quote) ? -1 : undefined) : value;
          const databaseUrl = new URL(unquoted);
          const remoteHost = databaseUrl.hostname;
          const remotePort = databaseUrl.port || "3306";

          databaseUrl.hostname = "127.0.0.1";
          databaseUrl.port = tunnelPort;
          lines[databaseLineIndex] = `DATABASE_URL=${quote}${databaseUrl.toString()}${quote}`;
          fs.writeFileSync(envPath, `${lines.join("\n")}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `DB_REMOTE_HOST=${remoteHost}\nDB_REMOTE_PORT=${remotePort}\n`);
          NODE

      - name: Open production database tunnel
        run: |
          ssh \
            -fN \
            -i ~/.ssh/kyakhayen_deploy_key \
            -p "$DEPLOY_PORT" \
            -L "127.0.0.1:$DB_TUNNEL_PORT:$DB_REMOTE_HOST:$DB_REMOTE_PORT" \
            -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Build production bundle
        run: |
          export NEXT_PRIVATE_BUILD_WORKER_COUNT=1
          npm run build

      - name: Package release artifact
        run: |
          tar \
            --exclude='.next/cache' \
            --exclude='.next/dev' \
            -czf kyakhayen-release.tgz \
            .next \
            public \
            prisma \
            scripts \
            workers \
            package.json \
            package-lock.json \
            next.config.mjs \
            ecosystem.config.cjs

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyakhayen-release
          path: kyakhayen-release.tgz
          retention-days: 3

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: check
    environment: KYAKHAYEN_DEPLOYMENT
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST || '13.206.210.16' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER || 'ubuntu' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/kasa/kyakhayen' }}
      DEPLOY_RELEASES_DIR: ${{ secrets.DEPLOY_RELEASES_DIR || vars.DEPLOY_RELEASES_DIR || '/opt/kasa/kyakhayen-releases' }}
      DEPLOY_CURRENT_LINK: ${{ secrets.DEPLOY_CURRENT_LINK || vars.DEPLOY_CURRENT_LINK || '/opt/kasa/kyakhayen-current' }}
      DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL || vars.DEPLOY_HEALTHCHECK_URL || 'http://127.0.0.1:3002/' }}
      DB_BACKUP_DIR: ${{ secrets.DB_BACKUP_DIR || vars.DB_BACKUP_DIR || '/opt/kasa/backups/kyakhayen-db' }}
      DB_BACKUP_RETENTION_DAYS: ${{ secrets.DB_BACKUP_RETENTION_DAYS || vars.DB_BACKUP_RETENTION_DAYS || '30' }}
      DB_BACKUP_S3_BUCKET: ${{ secrets.DB_BACKUP_S3_BUCKET || vars.DB_BACKUP_S3_BUCKET }}
      DB_BACKUP_S3_PREFIX: ${{ secrets.DB_BACKUP_S3_PREFIX || vars.DB_BACKUP_S3_PREFIX || 'kyakhayen/mysql' }}
      DEPLOY_SSH_KEY_PRESENT: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - name: Validate deploy inputs
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is empty"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is empty"; exit 1; }
          test -n "$DEPLOY_PORT" || { echo "DEPLOY_PORT is empty"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is empty"; exit 1; }
          test "$DEPLOY_SSH_KEY_PRESENT" = "true" || { echo "DEPLOY_SSH_KEY secret is empty"; exit 1; }

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: kyakhayen-release

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/kyakhayen_deploy_key
          chmod 600 ~/.ssh/kyakhayen_deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload release bundle
        run: |
          scp \
            -i ~/.ssh/kyakhayen_deploy_key \
            -P "$DEPLOY_PORT" \
            -o ConnectTimeout=20 \
            kyakhayen-release.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/kyakhayen-${GITHUB_SHA}.tgz"

      - name: Deploy release
        run: |
          ssh \
            -i ~/.ssh/kyakhayen_deploy_key \
            -p "$DEPLOY_PORT" \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_RELEASES_DIR='$DEPLOY_RELEASES_DIR' DEPLOY_CURRENT_LINK='$DEPLOY_CURRENT_LINK' DEPLOY_HEALTHCHECK_URL='$DEPLOY_HEALTHCHECK_URL' DB_BACKUP_DIR='$DB_BACKUP_DIR' DB_BACKUP_RETENTION_DAYS='$DB_BACKUP_RETENTION_DAYS' DB_BACKUP_S3_BUCKET='$DB_BACKUP_S3_BUCKET' DB_BACKUP_S3_PREFIX='$DB_BACKUP_S3_PREFIX' RELEASE_ID='$GITHUB_SHA' bash -s" <<'EOF'
          set -Eeuo pipefail

          release_dir="$DEPLOY_RELEASES_DIR/$RELEASE_ID"
          bundle="/tmp/kyakhayen-${RELEASE_ID}.tgz"
          previous_target=""

          if [ -L "$DEPLOY_CURRENT_LINK" ]; then
            previous_target="$(readlink -f "$DEPLOY_CURRENT_LINK")"
          elif [ -d "$DEPLOY_PATH" ]; then
            previous_target="$(readlink -f "$DEPLOY_PATH")"
          fi

          mkdir -p "$DEPLOY_RELEASES_DIR" "$release_dir"
          tar -xzf "$bundle" -C "$release_dir"

          if [ -f "$DEPLOY_PATH/.env" ]; then
            cp "$DEPLOY_PATH/.env" "$release_dir/.env"
          elif [ -n "$previous_target" ] && [ -f "$previous_target/.env" ]; then
            cp "$previous_target/.env" "$release_dir/.env"
          else
            echo ".env file missing in $DEPLOY_PATH and previous release"
            exit 1
          fi

          cd "$release_dir"
          npm ci --omit=dev || npm install --omit=dev

          export NODE_ENV=production
          node scripts/backup-database.mjs predeploy
          npx prisma migrate deploy

          ln -sfn "$release_dir" "$DEPLOY_CURRENT_LINK"
          export KYAKHAYEN_DEPLOY_PATH="$DEPLOY_CURRENT_LINK"

          if ! pm2 reload "$DEPLOY_CURRENT_LINK/ecosystem.config.cjs" --update-env; then
            pm2 start "$DEPLOY_CURRENT_LINK/ecosystem.config.cjs" --update-env
          fi

          sleep 8
          if ! curl -fsS --max-time 15 "$DEPLOY_HEALTHCHECK_URL" >/dev/null; then
            echo "Health check failed for $RELEASE_ID"
            if [ -n "$previous_target" ] && [ -d "$previous_target" ]; then
              ln -sfn "$previous_target" "$DEPLOY_CURRENT_LINK"
              export KYAKHAYEN_DEPLOY_PATH="$DEPLOY_CURRENT_LINK"
              pm2 reload "$DEPLOY_CURRENT_LINK/ecosystem.config.cjs" --update-env || true
            fi
            exit 1
          fi

          pm2 save
          find "$DEPLOY_RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d | sort | head -n -5 | xargs -r rm -rf
          rm -f "$bundle"
          EOF
